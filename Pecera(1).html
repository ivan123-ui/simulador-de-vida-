<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pecera</title>
<style>
:root{--bg:#000;--fg:#e8efe9;--panel:#0b0b0b;--bd:#262626;--acc:#4fd18b;--world:rgba(255,255,255,.035);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
input[type=range]{width:110px;accent-color:var(--acc)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--panel)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.stats b{font-weight:650}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
footer{padding:8px 10px;border-top:1px solid var(--bd);background:var(--panel)}footer .ctl{justify-content:center}
button:hover{border-color:var(--acc)}button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:flex;gap:5px;align-items:center;cursor:pointer}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#info{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:13px;display:none;max-width:260px}
#info h3{margin:0 0 4px;font-size:14px}#info div{display:flex;justify-content:space-between;gap:16px}
</style>
</head>
<body>
<header>
 <div class="stats"><span>Plantas <b id="sP">0</b></span><span>Herbívoros <b id="sH">0</b></span><span>Carnívoros <b id="sC">0</b></span><span>Gigantes <b id="sG">0</b></span><span>FPS <b id="sF">0</b></span><span>Tiempo <b id="sT">0:00</b></span><span>Velocidad <b id="sS">×1</b></span></div>
</header>
<div id="wrap"><canvas id="cv"></canvas><div id="info"></div></div>
<footer>
 <div class="ctl">
  <button id="bSound">🔊 Sonido</button><button id="bPause">Pausar</button><button id="bReset">Reiniciar</button>
  <label>Velocidad <input type="range" id="spd" min="0.1" max="10" step="0.1" value="1"></label>
  <button id="aP">+ Planta</button><button id="aH">+ Herbívoro</button><button id="aC">+ Carnívoro</button><button id="aG">+ Gigante</button>
  <label><input type="checkbox" id="dbg">Depuración</label>
 </div>
</footer>

/* ============ Entidades ============ */
let NEXT_ID=1;
class Entity{constructor(x,y){this.id=NEXT_ID++;this.x=x;this.y=y;this.age=0;this.hp=1;this.maxHp=1;this.dead=false;this.state=''}}
class Plant extends Entity{
 constructor(x,y){super(x,y);const c=CFG.plant;this.species='Planta';this.hp=c.hp0;this.maxHp=c.hpMax;this.state='CRECIENDO';this.claimedBy=null;this.fade=1;this.speed=0;this.target=null}
 get radius(){const c=CFG.plant;return lerp(c.rMin,c.rMax,clamp(this.hp/this.maxHp,0,1))*Math.min(1,this.age/c.appear)*this.fade}
 update(dt){this.age+=dt;if(this.state==='CRECIENDO')this.hp=Math.min(this.maxHp,this.hp+CFG.plant.growth*dt)}
}
class Animal extends Entity{
 constructor(x,y,cfg){super(x,y);this.cfg=cfg;this.hp=cfg.hp0;this.maxHp=cfg.maxHp;this.angle=rnd(0,TAU);this.wander=this.angle;
  this.speed=0;this.state='DEAMBULANDO';this.target=null;this.timer=0;this.fade=1;this.cool=0;this.ph=rnd(0,6)}
 get radius(){const c=this.cfg;return lerp(c.rMin,c.rMax,clamp(this.hp/this.maxHp,0,1))*Math.min(1,this.age/.5)*this.fade*(this.state==='MURIENDO'?clamp(this.timer/CFG.dyingTime,0,1):1)}
 wanderDir(dt,w){this.wander+=rnd(-1.5,1.5)*dt*3;const m=40;
  if(this.x<m||this.x>w.w-m||this.y<m||this.y>w.h-m)this.wander=Math.atan2(w.h/2-this.y,w.w/2-this.x);return this.wander}
 // Movimiento: giro gradual, aceleración suave, coste de vida por distancia recorrida (independiente de FPS)
 move(dt,w,ang,spd){const t=this.cfg.turn*dt;this.angle+=clamp(angDiff(this.angle,ang),-t,t);
  this.speed=lerp(this.speed,spd,Math.min(1,dt*4));const d=this.speed*dt;this.ph+=d*.3;
  this.x+=Math.cos(this.angle)*d;this.y+=Math.sin(this.angle)*d;
  const m=this.radius;this.x=clamp(this.x,m,w.w-m);this.y=clamp(this.y,m,w.h-m);
  this.hp-=d*this.cfg.moveCost+this.cfg.idleCost*dt}
 rest(dt){this.speed=0;this.hp-=this.cfg.idleCost*dt*.5}
 die(){if(this.state==='MURIENDO')return;this.onDie();this.state='MURIENDO';this.timer=CFG.dyingTime;this.speed=0;this.target=null}
 tickDying(dt){this.timer-=dt;if(this.timer<=0)this.dead=true}
}
class Herbivore extends Animal{
 constructor(x,y){super(x,y,CFG.herb);this.species='Herbívoro';this.breed=rnd(3,8);this.sense=rnd(0,1)}
 freePlant(){const p=this.target;if(p&&!p.dead){p.claimedBy=null;p.state='CRECIENDO';p.fade=1}this.target=null}
 onDie(){if(this.state==='COMIENDO')this.freePlant();sfxDeath(this)}
 // Búsqueda lineal; sustituible por una rejilla espacial sin tocar la lógica de estados
 findPlant(w){let best=null,bd=this.cfg.perception;for(const p of w.plants){if(p.dead||p.claimedBy||(p.poison&&this.sense>.5))continue;const d=dist(this,p);if(d<bd){bd=d;best=p}}return best}
 update(dt,w){
  this.age+=dt;
  if(this.state==='MURIENDO'){this.tickDying(dt);return}
  if(this.state==='CAPTURADO')return; // lo gestiona el carnívoro
  const th=w.threat(this); // huye de los depredadores cercanos
  if(th){if(this.state==='COMIENDO')this.freePlant();this.state='HUYENDO';this.target=null;this.move(dt,w,Math.atan2(this.y-th.y,this.x-th.x),this.cfg.speed*this.cfg.fleeMul)}
  else if(this.state==='COMIENDO'){
   this.rest(dt);this.timer-=dt;const p=this.target;
   if(!p||p.dead){this.target=null;this.state='DEAMBULANDO'}
   else{p.fade=Math.max(0,this.timer/this.cfg.eatTime);
    if(this.timer<=0){if(p.poison){this.hp-=this.cfg.poisonDmg;w.fx(p.x,p.y,'#b05cff',12)}else{this.hp=Math.min(this.maxHp,this.hp+this.cfg.eatGain*(.4+.6*p.hp/p.maxHp));w.fx(p.x,p.y,'#7bea8a',10)}p.dead=true;this.target=null;this.state='DEAMBULANDO'}}
  }else{
   const t=this.target;
   if(!t||t.dead||(t.claimedBy&&t.claimedBy!==this)||dist(this,t)>this.cfg.perception*1.5)this.target=this.findPlant(w);
   if(this.target){const p=this.target;this.state='BUSCANDO';
    this.move(dt,w,Math.atan2(p.y-this.y,p.x-this.x),this.cfg.speed*this.cfg.seekMul);
    if(dist(this,p)<this.radius+p.radius*.6+1){this.state='COMIENDO';this.timer=this.cfg.eatTime;p.claimedBy=this;p.state='SIENDO COMIDA';this.speed=0}
   }else{this.state='DEAMBULANDO';this.move(dt,w,this.wanderDir(dt,w),this.cfg.speed)}
  }
  if(this.hp<this.maxHp*.12){if(!this.warned){this.warned=true;wail(false)}}else if(this.hp>this.maxHp*.3)this.warned=false;
  this.breed-=dt;
  if(this.breed<=0&&this.hp>=this.cfg.breedHp&&this.state!=='COMIENDO'&&this.state!=='CAPTURADO'&&w.herbs.length<this.cfg.max){
   this.breed=this.cfg.breedCool;this.hp-=this.cfg.breedCost;
   const c=w.addHerb(this.x+rnd(-8,8),this.y+rnd(-8,8));c.hp=this.cfg.babyHp;c.sense=clamp(this.sense+rnd(-.1,.1),0,1);w.fx(this.x,this.y,'#ffd1f0',8)}
  if(this.hp<=0)this.die();
 }
}
class Carnivore extends Animal{
 constructor(x,y){super(x,y,CFG.carn);this.species='Carnívoro';this.half=CFG.carn.cone*Math.PI/360;this.huntT=0}
 release(){const p=this.target;if(p&&!p.dead&&p.state==='CAPTURADO'){p.state='DEAMBULANDO';p.fade=1}this.target=null;this.huntT=0}
 onDie(){this.release();sfxDeath(this)}
 findPrey(w){let best=null,bd=1e9;for(const h of w.herbs){if(h.dead||h.state==='MURIENDO'||h.state==='CAPTURADO')continue;
  if(!inCone(this,h,this.cfg.range,this.half))continue;const d=dist(this,h);if(d<bd){bd=d;best=h}}return best}
 update(dt,w){
  this.age+=dt;this.cool-=dt;
  if(this.state==='MURIENDO'){this.tickDying(dt);return}
  if(this.state==='CAPTURADO')return;
  if(this.state==='ATACANDO'){
   this.rest(dt);this.timer-=dt;const p=this.target;
   if(!p||p.dead||p.state!=='CAPTURADO'){this.release();this.state='DEAMBULANDO'}
   else{p.fade=Math.max(0,this.timer/this.cfg.attackTime);
    if(this.timer<=0){this.hp=Math.min(this.maxHp,this.hp+this.cfg.gain);p.dead=true;w.fx(p.x,p.y,'#ff7a6b',16);this.target=null;this.huntT=0;this.state='DEAMBULANDO';this.cool=1}}
  }else{
   const t=this.target;
   if(t&&(t.dead||t.state==='MURIENDO'||t.state==='CAPTURADO'||dist(this,t)>this.cfg.giveUp||this.huntT>this.cfg.huntMax)){this.target=null;this.huntT=0;this.cool=2}
   if(!this.target&&this.cool<=0)this.target=this.findPrey(w);
   if(this.target){const p=this.target;this.state='CAZANDO';this.huntT+=dt;
    this.move(dt,w,Math.atan2(p.y-this.y,p.x-this.x),this.cfg.huntSpeed);
    if(dist(this,p)<this.radius+p.radius*.8+2){
     if(p.state==='COMIENDO')p.freePlant();if(p.state==='ATACANDO')p.release();
     p.state='CAPTURADO';p.speed=0;p.target=null;sfxDeath(p);this.state='ATACANDO';this.timer=this.cfg.attackTime;this.speed=0}
   }else{this.state='DEAMBULANDO';this.move(dt,w,this.wanderDir(dt,w),this.cfg.speed)}
  }
  if(this.hp<=0)this.die();
 }
}
class Giant extends Carnivore{
 constructor(x,y){super(x,y);this.cfg=CFG.giant;this.hp=this.cfg.hp0;this.maxHp=this.cfg.maxHp;this.half=this.cfg.cone*Math.PI/360;this.species='Gigante'}
 // El gigante caza herbívoros y carnívoros (nunca a otros gigantes)
 findPrey(w){let best=null,bd=1e9;for(const h of [...w.herbs,...w.carns]){if(h===this||h.dead||h.species==='Gigante'||h.state==='MURIENDO'||h.state==='CAPTURADO')continue;
  if(!inCone(this,h,this.cfg.range,this.half))continue;const d=dist(this,h);if(d<bd){bd=d;best=h}}return best}
}
/* ============ Mundo / motor de simulación (sin dibujo) ============ */
class World{
 constructor(){this.w=CFG.world.w;this.h=CFG.world.h;this.reset()}
 reset(){const c=CFG.world;this.plants=[];this.herbs=[];this.carns=[];this.parts=[];this.time=0;this.spT=0;this.rH=0;this.rC=0;
  for(let i=0;i<c.plants;i++){const p=this.addPlant();if(p){p.hp=rnd(CFG.plant.hp0,CFG.plant.hpMax*.7);p.age=9}}
  for(let i=0;i<c.herbs;i++)this.addHerb();for(let i=0;i<c.carns;i++)this.addCarn();for(let i=0;i<c.giants;i++)this.addGiant()}
 pos(m=20){return[rnd(m,this.w-m),rnd(m,this.h-m)]}
 addPlant(x,y){if(this.plants.length>=CFG.plant.max)return null;const p=new Plant(...(x==null?this.pos():[x,y]));p.poison=Math.random()<CFG.plant.poison;this.plants.push(p);return p}
 addHerb(x,y){const a=new Herbivore(...(x==null?this.pos():[x,y]));this.herbs.push(a);return a}
 addCarn(x,y){const a=new Carnivore(...(x==null?this.pos():[x,y]));this.carns.push(a);return a}
  threat(a){for(const c of this.carns){if(c.dead||c.state==='MURIENDO'||c.state==='CAPTURADO'||c.state==='ATACANDO')continue;if(dist(a,c)<a.cfg.fear+c.radius)return c}return null}
 addGiant(x,y){const a=new Giant(...(x==null?this.pos(60):[x,y]));this.carns.push(a);return a}
 edge(){const s=Math.floor(rnd(0,4));return s<2?[rnd(20,this.w-20),s?this.h-20:20]:[s==2?20:this.w-20,rnd(20,this.h-20)]}
 fx(x,y,col,n=8){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(15,50);this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7,col})}}
 update(dt){
  this.time+=dt;this.spT+=dt;
  while(this.spT>=CFG.plant.every){this.spT-=CFG.plant.every;this.addPlant()}
  for(const p of this.plants)p.update(dt);
  for(const h of this.herbs)h.update(dt,this);
  for(const c of this.carns)c.update(dt,this);
  this.plants=this.plants.filter(e=>!e.dead);this.herbs=this.herbs.filter(e=>!e.dead);this.carns=this.carns.filter(e=>!e.dead);
  for(const q of this.parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt}this.parts=this.parts.filter(q=>q.life>0);
  const r=CFG.rescue;
  if(this.herbs.length<r.minHerb){this.rH+=dt;if(this.rH>r.delay){this.rH=0;this.addHerb(...this.edge())}}else this.rH=0;
  if(this.carns.filter(c=>c.species==='Carnívoro').length<r.minCarn){this.rC+=dt;if(this.rC>r.delay*2){this.rC=0;this.addCarn(...this.edge())}}else this.rC=0;
 }
}
/* ============ Renderizado (solo dibuja) ============ */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let sc=1,ox=0,oy=0,dpr=1,debug=false,selected=null;
function resize(){dpr=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;cv.width=r.width*dpr;cv.height=r.height*dpr;
 // El mundo se adapta a la forma de la pantalla: llena el área y todo se ve grande
 const H=CFG.world.h,W=clamp(H*r.width/r.height,380,1600);world.w=W;world.h=H;
 for(const e of [...world.plants,...world.herbs,...world.carns]){e.x=clamp(e.x,5,W-5);e.y=clamp(e.y,5,H-5)}
 sc=Math.min(r.width/W,r.height/H)*dpr;ox=(cv.width-W*sc)/2;oy=(cv.height-H*sc)/2}
const BUB=Array.from({length:30},()=>[Math.random(),Math.random(),rnd(14,36),rnd(1.5,4)]),ROCKS=Array.from({length:12},()=>[Math.random(),rnd(0,10),rnd(4,10)]);
function eye(x,y,er,look,closed){ctx.save();ctx.translate(x,y);ctx.scale(1,closed?.12:1);circle(0,0,er,'#fff');circle(Math.cos(look)*er*.35,Math.sin(look)*er*.35,er*.55,'#111');ctx.restore()}
function drawPlant(p,t){const r=p.radius;if(r<.3)return;const pc=p.poison,col=pc?'#a24fe0':'#2fbf55',lt=pc?'#d9a6ff':'#7be08f';ctx.lineCap='round';
 for(let i=-2;i<=2;i++){const sw=Math.sin(t*1.8+p.id+i)*r*.35,x=p.x+i*r*.3;ctx.strokeStyle=i%2?lt:col;ctx.lineWidth=Math.max(1.5,r*.22);ctx.beginPath();ctx.moveTo(x,p.y+r*.8);ctx.quadraticCurveTo(x+sw,p.y,x+sw*1.4,p.y-r*(1.1-Math.abs(i)*.2));ctx.stroke()}
 if(pc){circle(p.x,p.y-r*.2,r*.16,'#fff');circle(p.x+r*.3,p.y-r*.5,r*.12,'#ffe66b')}}
function drawAnimal(a,t){
 const r=a.radius;if(r<.5)return;
 const c=a.species!=='Herbívoro',g=a.species==='Gigante';
 const body=g?'#8e44ad':c?'#e0463d':'#ffa53a',dark=g?'#4a1d66':c?'#8c1f1a':'#c9611a',lite=g?'#c28ae0':c?'#ff9a85':'#ffd48a';
 const open=a.state==='CAZANDO'||a.state==='ATACANDO',eat=a.state==='COMIENDO',scared=a.state==='HUYENDO';
 let look=0;if(a.target&&!a.target.dead)look=clamp(angDiff(a.angle,Math.atan2(a.target.y-a.y,a.target.x-a.x)),-1,1);
 const closed=((t*.5+a.id*1.7)%4)<.12||a.state==='MURIENDO';
 const wag=Math.sin(a.ph*2+t*2)*(.25+Math.min(a.speed,100)/200);
 ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angle);
 if((Math.cos(a.angle)<0)!==(a.state==='MURIENDO'))ctx.scale(1,-1); // el pez nunca nada boca abajo (salvo muerto)
 ctx.save();ctx.translate(-r*1.1,0);ctx.rotate(wag);ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(r*.2,0);ctx.lineTo(-r*.9,-r*.75);ctx.lineTo(-r*.6,0);ctx.lineTo(-r*.9,r*.75);ctx.closePath();ctx.fill();ctx.restore();
 ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(-r*.5,-r*.55);ctx.quadraticCurveTo(0,-r*1.25,r*.5,-r*.55);ctx.fill();
 ctx.beginPath();ctx.ellipse(-r*.1,r*.45,r*.4,r*.2,.5+wag*.5,0,TAU);ctx.fill();
 ctx.beginPath();ctx.ellipse(0,0,r*1.2,r*.75,0,0,TAU);ctx.fillStyle=body;ctx.fill();
 ctx.beginPath();ctx.ellipse(r*.05,r*.2,r*.9,r*.35,0,0,TAU);ctx.fillStyle=lite;ctx.fill();
 ctx.strokeStyle=dark;ctx.globalAlpha=.45;ctx.lineWidth=r*.12;for(const x of [-.4,0,.4]){ctx.beginPath();ctx.moveTo(x*r,-r*.65);ctx.lineTo(x*r,r*.6);ctx.stroke()}ctx.globalAlpha=1;
 ctx.beginPath();ctx.arc(r*.45,0,r*.5,-1,1);ctx.lineWidth=r*.07;ctx.stroke();
 if(open){ctx.fillStyle='#240808';ctx.beginPath();ctx.moveTo(r*1.2,-r*.05);ctx.lineTo(r*.8,r*.25);ctx.lineTo(r*.8,-r*.3);ctx.fill();
  ctx.fillStyle='#fff';for(const x of [.85,1,1.12]){ctx.beginPath();ctx.moveTo(r*x,-r*.2);ctx.lineTo(r*(x+.08),-r*.2);ctx.lineTo(r*(x+.04),-r*.02);ctx.fill()}}
 else if(eat){ctx.fillStyle='#240808';ctx.beginPath();ctx.ellipse(r*1.15,0,r*.12,r*(.05+Math.abs(Math.sin(t*20))*.1),0,0,TAU);ctx.fill()}
 const er=r*.22*(scared?1.3:1);eye(r*.75,-r*.2,er,look,closed);
 if(c){ctx.strokeStyle='#150404';ctx.lineWidth=r*.09;ctx.beginPath();ctx.moveTo(r*.5,-r*.55);ctx.lineTo(r*1.0,-r*.3);ctx.stroke()}
 ctx.restore();
}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(r,0),0,TAU);ctx.fillStyle=fill;ctx.fill()}
function render(w){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
 ctx.setTransform(sc,0,0,sc,ox,oy);
 const cs=getComputedStyle(document.documentElement);
 const gr=ctx.createLinearGradient(0,0,0,w.h);gr.addColorStop(0,'#1583a8');gr.addColorStop(1,'#04283a');ctx.fillStyle=gr;ctx.fillRect(0,0,w.w,w.h);
 for(let i=0;i<4;i++){const x=w.w*(i+.5)/4+Math.sin(w.time*.3+i)*30;ctx.fillStyle='rgba(255,255,255,.04)';ctx.beginPath();ctx.moveTo(x-20,0);ctx.lineTo(x+20,0);ctx.lineTo(x+90,w.h);ctx.lineTo(x-60,w.h);ctx.fill()}
 const sd=ctx.createLinearGradient(0,w.h-30,0,w.h);sd.addColorStop(0,'rgba(214,190,130,0)');sd.addColorStop(1,'#d8c28a');ctx.fillStyle=sd;ctx.fillRect(0,w.h-30,w.w,30);
 for(const q of ROCKS)circle(q[0]*w.w,w.h-q[1],q[2],'#7d8a8f');
 ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;for(const b of BUB){const y=w.h-((w.time*b[2]+b[1]*w.h)%w.h);ctx.beginPath();ctx.arc(b[0]*w.w+Math.sin(w.time*2+b[1]*9)*4,y,b[3],0,TAU);ctx.stroke()}
 ctx.strokeStyle='rgba(180,230,255,.55)';ctx.lineWidth=4;ctx.strokeRect(0,0,w.w,w.h);
 for(const p of w.plants)drawPlant(p,w.time);
 for(const a of [...w.herbs,...w.carns]){
  if(debug&&a.state!=='MURIENDO'){const c=a.species!=='Herbívoro';ctx.lineWidth=1;
   if(!c){ctx.beginPath();ctx.arc(a.x,a.y,a.cfg.perception,0,TAU);ctx.strokeStyle='rgba(74,163,255,.5)';ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([])}
   else{ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.arc(a.x,a.y,a.cfg.range,a.angle-a.half,a.angle+a.half);ctx.closePath();ctx.fillStyle='rgba(255,90,79,.10)';ctx.fill();ctx.strokeStyle='rgba(255,90,79,.6)';ctx.stroke()}
   if(a.target&&!a.target.dead){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.target.x,a.target.y);ctx.strokeStyle=c?'rgba(255,90,79,.8)':'rgba(74,163,255,.8)';ctx.stroke()}}
  drawAnimal(a,w.time)}
 for(const a of [...w.herbs,...w.carns]){ if(a.state==='MURIENDO')continue;const r=a.radius,f=clamp(a.hp/a.maxHp,0,1);
  ctx.fillStyle='rgba(127,127,127,.35)';ctx.fillRect(a.x-r,a.y-r-6,r*2,2);ctx.fillStyle=f>.3?'#7bd88f':'#ffb454';ctx.fillRect(a.x-r,a.y-r-6,r*2*f,2)}
 for(const q of w.parts){ctx.globalAlpha=clamp(q.life/.7,0,1);circle(q.x,q.y,2,q.col)}ctx.globalAlpha=1;
 if(selected&&!selected.dead){ctx.beginPath();ctx.arc(selected.x,selected.y,selected.radius+5,0,TAU);ctx.strokeStyle='#ffd24a';ctx.lineWidth=2;ctx.stroke()}
}
/* ============ Interfaz y bucle principal ============ */
const world=new World(),$=id=>document.getElementById(id);
let spd=1,paused=false,fps=60,last=performance.now();
function ui(){
 $('sP').textContent=world.plants.length;$('sH').textContent=world.herbs.length;$('sC').textContent=world.carns.filter(c=>c.species==='Carnívoro').length;$('sG').textContent=world.carns.filter(c=>c.species==='Gigante').length;
 $('sF').textContent=Math.round(fps);const t=Math.floor(world.time);$('sT').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
 $('sS').textContent='×'+spd.toFixed(1);
 const i=$('info');
 if(selected&&!selected.dead){const s=selected;i.style.display='block';
  i.innerHTML=`<h3>${s.species} #${s.id}</h3><div><span>Vida</span><span>${Math.max(0,s.hp).toFixed(0)} / ${s.maxHp}</span></div><div><span>Edad</span><span>${s.age.toFixed(0)} s</span></div><div><span>Velocidad</span><span>${(s.speed||0).toFixed(0)}</span></div><div><span>Estado</span><span>${s.state.toLowerCase()}</span></div><div><span>Objetivo</span><span>${s.target&&!s.target.dead?s.target.species+' #'+s.target.id:'—'}</span></div>`}
 else{selected=null;i.style.display='none'}
}
function frame(now){
 const raw=Math.min((now-last)/1000,.1);last=now;fps=lerp(fps,1/Math.max(raw,1e-3),.1);
 if(!paused){let t=raw*spd;while(t>1e-6){const s=Math.min(1/60,t);world.update(s);t-=s}}
 render(world);ui();requestAnimationFrame(frame);
}
$('bPause').onclick=()=>{paused=!paused;$('bPause').textContent=paused?'Reanudar':'Pausar'};
$('bReset').onclick=()=>{world.reset();selected=null;if(window.speechSynthesis)speechSynthesis.cancel()};
$('spd').oninput=e=>{spd=+e.target.value};
$('aP').onclick=()=>world.addPlant();$('aH').onclick=()=>world.addHerb();$('aC').onclick=()=>world.addCarn();$('aG').onclick=()=>world.addGiant();
$('dbg').onchange=e=>{debug=e.target.checked};
$('bSound').onclick=()=>{sound=!sound;$('bSound').textContent=sound?'🔊 Sonido':'🔇 Sin sonido';if(sound)MUS.play().catch(()=>{});else MUS.pause()};
addEventListener('pointerdown',()=>{if(sound&&MUS.paused)MUS.play().catch(()=>{})});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();
 const x=((e.clientX-r.left)*dpr-ox)/sc,y=((e.clientY-r.top)*dpr-oy)/sc;let best=null,bd=1e9;
 for(const a of [...world.carns,...world.herbs,...world.plants]){const d=Math.hypot(a.x-x,a.y-y);if(d<a.radius+8&&d<bd){bd=d;best=a}}
 selected=best});
new ResizeObserver(resize).observe($('wrap'));resize();world.reset();requestAnimationFrame(frame);
</script>
